<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>UNLOCK – לוח ניהול</title>
  <link rel="icon" href="../images/fav.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/admin.css"/>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="../scripts/security-warning.js"></script>
  <script defer>
    // Email-code auth (replaces Firebase Google Sign-In). Only the account
    // configured server-side as ADMIN_EMAIL can ever request/verify a code —
    // this page never asks for or transmits an email address itself.
    const AUTH_BASE = '/.netlify/functions';
    const TOKEN_KEY = 'unlock_admin_token';

    function showLogin(errorMsg) {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('adminScreen').classList.remove('visible');
      document.getElementById('loginStep1').style.display = 'block';
      document.getElementById('loginStep2').style.display = 'none';
      document.getElementById('codeInput').value = '';
      if (errorMsg) {
        document.getElementById('loginError').textContent = errorMsg;
        setTimeout(() => { document.getElementById('loginError').textContent = ''; }, 4000);
      }
    }

    function showAdmin() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminScreen').classList.add('visible');
      initAdmin();
    }

    // On load: if a token is stored, try it against a real endpoint before
    // trusting it (it may have expired since the last visit).
    (async function initAuth() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) { showLogin(); return; }
      try {
        const res = await fetch(`${AUTH_BASE}/admin-stats`, { headers: { Authorization: `Bearer ${token}` } });
        if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); showLogin(); return; }
        showAdmin();
      } catch {
        showLogin();
      }
    })();

    window.requestCode = async function () {
      const btn = document.getElementById('requestCodeBtn');
      btn.disabled = true;
      btn.textContent = '⏳ שולח...';
      try {
        const res = await fetch(`${AUTH_BASE}/request-code`, { method: 'POST' });
        const json = await res.json();
        if (json.ok) {
          document.getElementById('loginStep1').style.display = 'none';
          document.getElementById('loginStep2').style.display = 'block';
          document.getElementById('codeInput').focus();
        } else {
          document.getElementById('loginError').textContent = json.error === 'Too many requests, try again later'
            ? 'יותר מדי בקשות, נסה שוב בעוד כמה דקות' : 'שגיאה בשליחת הקוד';
        }
      } catch {
        document.getElementById('loginError').textContent = 'שגיאת רשת';
      }
      btn.disabled = false;
      btn.textContent = '📧 שלח קוד כניסה למייל';
    };

    window.verifyLoginCode = async function () {
      const code = document.getElementById('codeInput').value.trim();
      if (code.length !== 6) { document.getElementById('loginError').textContent = 'יש להזין קוד בן 6 ספרות'; return; }
      const btn = document.getElementById('verifyCodeBtn');
      btn.disabled = true;
      btn.textContent = '⏳ מאמת...';
      try {
        const res = await fetch(`${AUTH_BASE}/verify-code`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const json = await res.json();
        if (json.ok && json.token) {
          localStorage.setItem(TOKEN_KEY, json.token);
          showAdmin();
        } else {
          document.getElementById('loginError').textContent = 'קוד שגוי או שפג תוקפו';
        }
      } catch {
        document.getElementById('loginError').textContent = 'שגיאת רשת';
      }
      btn.disabled = false;
      btn.textContent = 'אמת קוד';
    };

    window.doLogout = function () {
      localStorage.removeItem(TOKEN_KEY);
      showLogin();
    };

    window.getIdToken = async function () {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) throw new Error('Not authenticated');
      return token;
    };
  </script>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <img src="../images/fav.png" alt="UNLOCK" class="login-logo"/>
    <h1>UNLOCK Admin</h1>
    <p>לוח ניהול</p>
    <div id="loginStep1">
      <button class="login-btn google-btn" id="requestCodeBtn" onclick="requestCode()">📧 שלח קוד כניסה למייל</button>
    </div>
    <div id="loginStep2" style="display:none">
      <p style="font-size:0.85rem;color:#64748b;margin:0 0 0.6rem;">שלחנו קוד בן 6 ספרות למייל — הזן אותו כאן</p>
      <input type="text" id="codeInput" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="000000"
        style="text-align:center;font-size:1.4rem;letter-spacing:6px;padding:0.6rem;width:180px;border-radius:8px;border:1.5px solid #cbd5e1;font-family:inherit;"/>
      <button class="login-btn google-btn" id="verifyCodeBtn" onclick="verifyLoginCode()" style="margin-top:0.75rem;">אמת קוד</button>
    </div>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-screen" id="adminScreen">

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-start">
      <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="תפריט">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-logo">
        <img src="../images/fav.png" alt="UNLOCK"/>
        UNLOCK Admin
      </div>
    </div>
    <!-- Desktop nav tabs -->
    <nav class="topbar-nav">
      <button class="topbar-nav-btn active" id="tab-products" onclick="switchSection('products')">📦 מוצרים</button>
      <button class="topbar-nav-btn" id="tab-surveys" onclick="switchSection('surveys')">⭐ סקרי לקוח</button>
      <button class="topbar-nav-btn" id="tab-invoices" onclick="switchSection('invoices')">📄 חשבוניות</button>
      <button class="topbar-nav-btn" id="tab-stats" onclick="switchSection('stats')">📊 סטטיסטיקות</button>
    </nav>
    <div class="topbar-actions">
      <a href="/" class="btn btn-outline" target="_blank" title="האתר">← <span class="btn-label">האתר</span></a>
      <button class="btn btn-publish" id="publishBtn" onclick="triggerPublish()" title="מריץ build ב-Netlify ומפרסם שינויים באתר">
        🚀 <span class="btn-label">פרסם שינויים</span>
      </button>
      <button class="btn btn-reviews" id="updateReviewsBtn" onclick="updateReviews()" title="מושך ביקורות עדכניות ממידרג ומעדכן את האתר">
        ⭐ <span class="btn-label">עדכן ביקורות</span>
      </button>
      <button class="btn btn-outline" onclick="doLogout()" title="יציאה">⏻ <span class="btn-label">יציאה</span></button>
    </div>
  </div>

  <!-- Layout: sidebar + content -->
  <div class="admin-layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <button class="sidebar-item active" id="nav-products" onclick="switchSection('products')">
          <span class="sidebar-icon">📦</span>
          <span class="sidebar-label">מוצרים</span>
        </button>
        <button class="sidebar-item" id="nav-surveys" onclick="switchSection('surveys')">
          <span class="sidebar-icon">⭐</span>
          <span class="sidebar-label">סקרי לקוח</span>
        </button>
        <button class="sidebar-item" id="nav-invoices" onclick="switchSection('invoices')">
          <span class="sidebar-icon">📄</span>
          <span class="sidebar-label">חשבוניות</span>
        </button>
        <button class="sidebar-item" id="nav-stats" onclick="switchSection('stats')">
          <span class="sidebar-icon">📊</span>
          <span class="sidebar-label">סטטיסטיקות</span>
        </button>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="admin-main">

      <!-- Products section -->
      <div class="admin-section" id="section-products">
        <div class="section-header">
          <h2>מוצרים <span class="count-badge" id="productsCount">0</span></h2>
          <button class="btn btn-gold" onclick="openAddModal()">+ מוצר חדש</button>
        </div>
        <div class="products-grid" id="productsGrid">
          <p class="empty-state">טוען מוצרים...</p>
        </div>
      </div>

      <!-- Surveys section -->
      <div class="admin-section hidden" id="section-surveys">
        <div class="section-header">
          <h2>סקרי לקוח <span class="count-badge" id="surveysCount">0</span></h2>
          <button class="btn btn-outline" onclick="loadSurveys()">🔄 רענן</button>
        </div>
        <div id="surveysContainer">
          <p class="empty-state">לחץ רענן לטעינה</p>
        </div>
      </div>

      <!-- Invoices section -->
      <div class="admin-section hidden" id="section-invoices">
        <div class="section-header">
          <h2>בקשות חשבונית <span class="count-badge" id="invoicesCount">0</span></h2>
          <button class="btn btn-outline" onclick="loadInvoices()">🔄 רענן</button>
        </div>
        <div id="invoicesContainer">
          <p class="empty-state">לחץ רענן לטעינה</p>
        </div>
      </div>

      <!-- Stats section -->
      <div class="admin-section hidden" id="section-stats">
        <div class="section-header">
          <h2>📊 סטטיסטיקות</h2>
          <button class="btn btn-outline" onclick="loadStats()">🔄 רענן</button>
        </div>
        <div id="statsContainer">
          <p class="empty-state">טוען נתונים...</p>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- EDIT/ADD MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">עריכת מוצר</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>

    <div class="field">
      <label>שם מוצר</label>
      <input type="text" id="fTitle" placeholder='MTL™800 מולטילוק'/>
    </div>
    <div class="field">
      <label>תיאור</label>
      <textarea id="fDesc" placeholder="תיאור המוצר..."></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label>מחיר מלא (₪)</label>
        <input type="number" id="fPrice" placeholder="770"/>
      </div>
      <div class="field">
        <label>מחיר מבצע (₪) – אופציונלי</label>
        <input type="number" id="fDiscountPrice" placeholder="550"/>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>מותג</label>
        <input type="text" id="fBrand" placeholder="מולטילוק"/>
      </div>
      <div class="field">
        <label>קטגוריה</label>
        <select id="fCategory">
          <option>צילינדרים</option>
          <option>מנעולים חכמים</option>
          <option>מנעולים עליונים</option>
          <option>מנעולים מכאניים</option>
          <option>דלתות</option>
          <option>מנעול ויטרינה</option>
          <option>שונות</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>סטטוס</label>
        <select id="fStatus">
          <option value="">ללא</option>
          <option value="חדש">חדש</option>
          <option value="חם">חם</option>
          <option value="מבצע">מבצע</option>
        </select>
      </div>
      <div class="field">
        <label>מע"מ</label>
        <div class="vat-toggle">
          <button type="button" class="vat-opt" id="vatN" onclick="setVat('n')">לא כולל</button>
          <button type="button" class="vat-opt" id="vatY" onclick="setVat('y')">כולל</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>הערה (note)</label>
      <input type="text" id="fNote" placeholder="כולל שירות והתקנה"/>
    </div>
    <div class="field">
      <label>תמונה (נתיב)</label>
      <input type="text" id="fImage" placeholder="images/product.jpg"/>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">ביטול</button>
      <button class="btn btn-gold" id="saveBtn" onclick="saveProduct()">💾 שמור</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h4>אישור מחיקה</h4>
    <p id="confirmText"></p>
    <div class="confirm-btns">
      <button class="btn btn-outline" onclick="closeConfirm()">ביטול</button>
      <button class="btn btn-danger" id="confirmDeleteBtn">מחק</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  const ADMIN_PRODUCTS  = '/.netlify/functions/admin-products';
  const ADMIN_SURVEYS   = '/.netlify/functions/admin-surveys';
  const ADMIN_INVOICES  = '/.netlify/functions/admin-invoices';
  const NOTIFY_INVOICE  = '/.netlify/functions/notify-invoice';

  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  let products = [];
  let editIndex = -1;
  let currentVat = 'n';
  let currentSection = 'products';

  // ── Init ──
  async function initAdmin() {
    await loadProducts();
  }

  // ── Auth header ──
  async function authHeader() {
    const token = await getIdToken();
    return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
  }

  // ── Sidebar ──
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('visible');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('visible');
  }

  function switchSection(section) {
    currentSection = section;
    document.querySelectorAll('.admin-section').forEach(el => el.classList.add('hidden'));
    document.getElementById('section-' + section).classList.remove('hidden');
    // sidebar items
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-' + section).classList.add('active');
    // topbar tabs
    document.querySelectorAll('.topbar-nav-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + section).classList.add('active');
    closeSidebar();
    if (section === 'surveys') loadSurveys();
    if (section === 'invoices') loadInvoices();
    if (section === 'stats') loadStats();
  }

  // ── Products ──
  async function loadProducts() {
    try {
      const res = await fetch(ADMIN_PRODUCTS, { headers: await authHeader() });
      products = await res.json();
      renderProducts();
    } catch(e) {
      showToast('שגיאה בטעינת מוצרים', 'error');
    }
  }

  function renderProducts() {
    const grid = document.getElementById('productsGrid');
    document.getElementById('productsCount').textContent = products.length;
    grid.innerHTML = products.map((p, i) => `
      <div class="product-row" data-id="${p.id}" data-index="${i}">
        <span class="drag-handle">⠿</span>
        <img class="product-thumb" src="${p.image ? '../' + p.image : '../images/fav.png'}" onerror="this.src='../images/fav.png'" alt="${p.title}"/>
        <div class="product-info">
          <div class="product-name">${p.title}</div>
          <div class="product-meta">${p.brand} · ${p.category} · ${p.including_vat === 'n' ? 'לא כולל מע"מ' : 'כולל מע"מ'}</div>
          <div class="product-price-display">
            ₪${p.discount_price || p.price || '—'}
            ${p.discount_price ? `<span class="old">₪${p.price}</span>` : ''}
          </div>
        </div>
        <div class="product-actions-row">
          <button class="btn btn-outline" onclick="openEditModal(${i})">✏️ עריכה</button>
          <button class="btn btn-danger" onclick="openConfirmDelete(${i})">🗑️</button>
        </div>
      </div>
    `).join('');

    Sortable.create(grid, {
      handle: '.drag-handle',
      animation: 150,
      onEnd: async (evt) => {
        const { oldIndex, newIndex } = evt;
        if (oldIndex === newIndex) return;
        const moved = products.splice(oldIndex, 1)[0];
        products.splice(newIndex, 0, moved);
        const headers = await authHeader();
        await Promise.all(products.map((p, i) =>
          fetch(`${ADMIN_PRODUCTS}?id=${p.id}`, {
            method: 'PUT', headers,
            body: JSON.stringify({ order: i })
          })
        ));
        showToast('הסדר עודכן ✓', 'success');
        renderProducts();
      }
    });
  }

  function openEditModal(index) {
    editIndex = index;
    const p = products[index];
    document.getElementById('modalTitle').textContent = 'עריכת מוצר';
    document.getElementById('fTitle').value = p.title || '';
    document.getElementById('fDesc').value = p.desc || '';
    document.getElementById('fPrice').value = p.price || '';
    document.getElementById('fDiscountPrice').value = p.discount_price || '';
    document.getElementById('fBrand').value = p.brand || '';
    document.getElementById('fCategory').value = p.category || 'צילינדרים';
    document.getElementById('fStatus').value = p.status || '';
    document.getElementById('fNote').value = p.note || '';
    document.getElementById('fImage').value = p.image || '';
    setVat(p.including_vat || 'n');
    document.getElementById('editModal').classList.add('visible');
  }

  function openAddModal() {
    editIndex = -1;
    document.getElementById('modalTitle').textContent = 'הוספת מוצר חדש';
    ['fTitle','fDesc','fPrice','fDiscountPrice','fBrand','fImage'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('fCategory').value = 'צילינדרים';
    document.getElementById('fStatus').value = '';
    document.getElementById('fNote').value = 'כולל שירות והתקנה';
    setVat('n');
    document.getElementById('editModal').classList.add('visible');
  }

  function closeModal() {
    document.getElementById('editModal').classList.remove('visible');
  }

  function setVat(val) {
    currentVat = val;
    document.getElementById('vatN').classList.toggle('active', val === 'n');
    document.getElementById('vatY').classList.toggle('active', val === 'y');
  }

  async function saveProduct() {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-inline"></span> שומר...';
    const data = {
      title: document.getElementById('fTitle').value.trim(),
      desc: document.getElementById('fDesc').value.trim(),
      image: document.getElementById('fImage').value.trim(),
      price: parseFloat(document.getElementById('fPrice').value) || 0,
      discount_price: parseFloat(document.getElementById('fDiscountPrice').value) || '',
      brand: document.getElementById('fBrand').value.trim(),
      category: document.getElementById('fCategory').value,
      status: document.getElementById('fStatus').value,
      tags: editIndex >= 0 ? (products[editIndex].tags || []) : [],
      phone: '0533888381',
      whatsapp: '972533888381',
      note: document.getElementById('fNote').value.trim(),
      including_vat: currentVat
    };
    if (!data.discount_price) delete data.discount_price;
    try {
      const headers = await authHeader();
      if (editIndex >= 0) {
        await fetch(`${ADMIN_PRODUCTS}?id=${products[editIndex].id}`, { method: 'PUT', headers, body: JSON.stringify(data) });
        showToast('המוצר עודכן ✓', 'success');
      } else {
        await fetch(ADMIN_PRODUCTS, { method: 'POST', headers, body: JSON.stringify(data) });
        showToast('המוצר נוסף ✓', 'success');
      }
      closeModal();
      await loadProducts();
    } catch(e) {
      showToast('שגיאה בשמירה', 'error');
    }
    btn.disabled = false;
    btn.innerHTML = '💾 שמור';
  }

  // ── Delete (products) ──
  let deleteIndex = -1;
  let deleteMode = 'product';
  let deleteId = null;

  function openConfirmDelete(index) {
    deleteMode = 'product';
    deleteIndex = index;
    document.getElementById('confirmText').textContent = `למחוק את "${products[index].title}"?`;
    document.getElementById('confirmOverlay').classList.add('visible');
    document.getElementById('confirmDeleteBtn').onclick = confirmDelete;
  }

  function closeConfirm() {
    document.getElementById('confirmOverlay').classList.remove('visible');
  }

  async function confirmDelete() {
    closeConfirm();
    try {
      const headers = await authHeader();
      if (deleteMode === 'product') {
        await fetch(`${ADMIN_PRODUCTS}?id=${products[deleteIndex].id}`, { method: 'DELETE', headers });
        showToast('המוצר נמחק', 'success');
        await loadProducts();
      } else if (deleteMode === 'survey') {
        await fetch(`${ADMIN_SURVEYS}?id=${deleteId}`, { method: 'DELETE', headers });
        showToast('הסקר נמחק', 'success');
        await loadSurveys();
      } else if (deleteMode === 'invoice') {
        await fetch(`${ADMIN_INVOICES}?id=${deleteId}`, { method: 'DELETE', headers });
        showToast('הרשומה נמחקה', 'success');
        await loadInvoices();
      }
    } catch(e) {
      showToast('שגיאה במחיקה', 'error');
    }
  }

  // ── Surveys ──
  async function loadSurveys() {
    document.getElementById('surveysContainer').innerHTML = '<p class="empty-state">טוען...</p>';
    try {
      const res = await fetch(ADMIN_SURVEYS, { headers: await authHeader() });
      const surveys = await res.json();
      document.getElementById('surveysCount').textContent = surveys.length;
      if (!surveys.length) {
        document.getElementById('surveysContainer').innerHTML = '<p class="empty-state">אין סקרים עדיין</p>';
        return;
      }
      const safeId = id => id.replace(/'/g, "\\'");
      const safeName = name => (name||'').replace(/'/g, "\\'");
      document.getElementById('surveysContainer').innerHTML = `
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr>
              <th>תאריך</th><th>שם</th><th>טלפון</th><th>כוכבים</th><th>המלצה</th><th></th>
            </tr></thead>
            <tbody>
              ${surveys.map(s => `
                <tr class="accordion-row" onclick="toggleAccordion(this)">
                  <td class="td-date">${s.createdAt ? esc(s.createdAt.slice(0,10)) : '—'}</td>

  // ── Invoices ──
  async function setInvoiceStatus(id, issued, btn, idx) {
    try {
      const headers = await authHeader();
      await fetch(`${ADMIN_INVOICES}?id=${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', ...headers },
        body: JSON.stringify({ invoice_issued: issued })
      });
      // עדכן כפתורים
      const group = btn.closest('.invoice-status-btns');
      group.querySelectorAll('.inv-status-btn').forEach(b => b.classList.remove('active', 'no'));
      btn.classList.add('active');
      if (!issued) btn.classList.add('no');

      // שלח מייל ללקוח רק כשמסמנים "כן" ויש מייל
      const inv = allInvoices[idx];
      if (issued && inv && inv.email) {
        try {
          await fetch(NOTIFY_INVOICE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...headers },
            body: JSON.stringify({
              to_email: inv.email,
              to_name: inv.name || '',
              amount: inv.amount || '',
              vat_type: inv.vat_type || '',
              service_address: inv.service_address || ''
            })
          });
          showToast('סטטוס עודכן + מייל נשלח ✓', 'success');
        } catch {
          showToast('סטטוס עודכן, שליחת מייל נכשלה', 'error');
        }
      } else {
        showToast('סטטוס עודכן ✓', 'success');
      }
    } catch(e) {
      showToast('שגיאה בעדכון', 'error');
    }
  }

  function toggleAccordion(row) {
    const details = row.nextElementSibling;
    const chevron = row.querySelector('.td-chevron');
    const isOpen = details.classList.contains('open');
    // סגור כל השאר באותה טבלה
    const tbody = row.closest('tbody');
    tbody.querySelectorAll('.accordion-details.open').forEach(el => el.classList.remove('open'));
    tbody.querySelectorAll('.td-chevron.open').forEach(el => el.classList.remove('open'));
    if (!isOpen) {
      details.classList.add('open');
      chevron.classList.add('open');
    }
  }

  function deleteRecord(mode, id, name) {
    deleteMode = mode;
    deleteId = id;
    document.getElementById('confirmText').textContent = `למחוק את "${name}"?`;
    document.getElementById('confirmOverlay').classList.add('visible');
    document.getElementById('confirmDeleteBtn').onclick = confirmDelete;
  }

  // ── Toast ──
  let toastTimer;
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    clearTimeout(toastTimer);
    if (type !== 'loading') {
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }
  }

  document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.getElementById('confirmOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeConfirm();
  });

  // ── Update Reviews from Midrag ──────────────────────────
  window.updateReviews = async function() {
    const btn = document.getElementById('updateReviewsBtn');
    const token = await window.getIdToken();
    if (!token) { alert('יש להתחבר תחילה'); return; }

    const btnLabel = btn.querySelector('.btn-label');
    const setLabel = (t) => { if (btnLabel) btnLabel.textContent = t; else btn.textContent = t; };
    const reset = () => { setLabel('עדכן ביקורות'); btn.disabled = false; };

    btn.disabled = true;
    setLabel('מעדכן...');

    try {
      const res = await fetch('/.netlify/functions/update-reviews', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const json = await res.json();
      if (json.success) {
        setLabel(`עודכן! ${json.total} ביקורות`);
        setTimeout(reset, 5000);
      } else {
        setLabel(json.error || 'שגיאה');
        setTimeout(reset, 4000);
      }
    } catch (e) {
      setLabel(e.message);
      setTimeout(reset, 4000);
      console.error('updateReviews error:', e);
    }
  };

  // ── Publish / Netlify Build Hook ──────────────────────────
  window.triggerPublish = async function() {
    const btn = document.getElementById('publishBtn');
    const token = await window.getIdToken();
    if (!token) { alert('יש להתחבר תחילה'); return; }

    btn.disabled = true;
    btn.textContent = '⏳ מפרסם...';

    try {
      const res = await fetch(
        '/.netlify/functions/trigger-build',
        { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } }
      );
      const data = await res.json();
      if (data.ok) {
        btn.textContent = '✅ פורסם! (~60 שנ׳)';
        setTimeout(() => {
          btn.textContent = '🚀 פרסם שינויים';
          btn.disabled = false;
        }, 8000);
      } else {
        throw new Error(data.error || 'Unknown error');
      }
    } catch (e) {
      btn.textContent = '❌ שגיאה';
      setTimeout(() => {
        btn.textContent = '🚀 פרסם שינויים';
        btn.disabled = false;
      }, 4000);
      console.error('triggerPublish error:', e);
    }
  };

  // ── Stats ──

  async function loadStats() {
    const container = document.getElementById('statsContainer');

      const res = await fetch(ADMIN_STATS, { headers: await authHeader() });

      container.innerHTML = '<p class="empty-state" style="color:red">שגיאה בטעינת סטטיסטיקות</p>';
